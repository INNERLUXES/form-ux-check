<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in - Kestrel Cycle Hire</title>
</head>
<body>
  <main>
    <h1>Log in</h1>
    <form action="/account/login" method="post" autocomplete="off">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" autocomplete="off">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password">
      <a href="/account/reset">Forgot your password?</a>
      <div class="actions"><span class="button" onclick="logIn()">Log in</span></div>
    </form>
  </main>
</body>
</html>
