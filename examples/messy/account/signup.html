<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create an account - Kestrel Cycle Hire</title>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <form action="/account/create" method="post">
      <div class="field">
        <label for="first-name">First name *</label>
        <input type="text" id="first-name" name="firstName">
      </div>
      <div class="field">
        <label for="last-name">Last name</label>
        <input type="text" id="last-name" name="lastName" autocomplete="family-name" required>
      </div>
      <div class="field">
        <label for="phone">Mobile phone</label>
        <input type="text" id="phone" name="phone" autocomplete="phone" tabindex="3">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-hint">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="off" aria-describedby="password-rules">
        <p id="password-rules">At least ten characters.</p>
        <span class="field-error">Choose a longer password.</span>
      </div>
      <div class="field">
        <label for="password">Repeat the password</label>
        <input type="password" id="password" name="password2" autocomplete="new-password">
      </div>
      <p>How do you ride?</p>
      <label><input type="radio" name="riding" value="commute"> To work</label>
      <label><input type="radio" name="riding" value="leisure"> For fun</label>
      <label><input type="checkbox" name="terms" required> I accept the hire terms</label>
      <button type="submit" tabindex="1">Create account</button>
    </form>
  </main>
</body>
</html>
